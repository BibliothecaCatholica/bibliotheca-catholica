name: epub-pilot
# Structured-text and EPUB pilot (PR #24). Builds the review EPUB from the hosted TXT and data/structured/, runs the
# fidelity gate, and attaches the file to the workflow run as an artifact (built into epub-review/: upload-artifact
# skips hidden directories such as .epub-build/). The published EPUBs in downloads/epub/ (tools/build_epub.py --publish)
# are checked too.
# Runs on every pull request (November 15, 2026): a paths filter missed the cover tool and assets on PR #32, and the
# EPUB depends on many inputs (texts, structure, layout, covers, notices, renderers). The job takes under a minute.
on:
  pull_request:
permissions:
  contents: read
jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 tools/structure_text.py --check
      - run: python3 tools/build_epub.py --out epub-review
      # Step 2c (owner, November 14, 2026): EPUBCheck, the W3C validator; any error (or fatal) fails the job. Uses the
      # runner's preinstalled Java.
      - name: EPUBCheck 5.1.0 (pinned by SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          echo "74a59af8602bf59b1d04266a450d9cdcb5986e36d825adc403cde0d95e88c9e8  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          java -jar "$RUNNER_TEMP/epubcheck-5.1.0/epubcheck.jar" epub-review/orthodoxy-pg-130.epub
          for f in downloads/epub/*.epub; do java -jar "$RUNNER_TEMP/epubcheck-5.1.0/epubcheck.jar" "$f"; done  # the published EPUBs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orthodoxy-pg-130-epub-review
          path: epub-review/
          retention-days: 30
          if-no-files-found: error
