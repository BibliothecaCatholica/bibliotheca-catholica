name: epub-pilot
# Structured-text and EPUB pilot (PR #24). Builds the review EPUB from the hosted TXT and data/structured/, runs the
# fidelity gate, and attaches the file to the workflow run as an artifact (built into epub-review/: upload-artifact
# skips hidden directories such as .epub-build/). It is not published or linked from the site.
on:
  pull_request:
    paths:
      - 'data/structured/**'
      - 'data/texts/pg-130.txt'
      - 'data/sources/gutenberg-html/**'
      - 'tools/structure_text.py'
      - 'tools/build_epub.py'
      - 'tools/reader_formatting.py'
      - '.github/workflows/epub-pilot.yml'
permissions:
  contents: read
jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tools/structure_text.py --check
      - run: python3 tools/build_epub.py --out epub-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orthodoxy-pg-130-epub-review
          path: epub-review/
          retention-days: 30
          if-no-files-found: error
