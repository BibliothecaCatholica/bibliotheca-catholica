name: Prepare library update
on:
  push:
    branches: [codex/libraries-saints-recovery-20261109]
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.head_commit.message == 'Add library research paths and offline saints recovery source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/libraries-saints-recovery-20261109
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python3 tools/build_static.py
      - run: npm run build:study
      - run: npm test
      - name: Commit generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Build library research desk and refresh generated pages'
          git push origin HEAD:codex/libraries-saints-recovery-20261109
