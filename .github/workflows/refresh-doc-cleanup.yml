name: Refresh generated output for documentation cleanup
on:
  push:
    branches: [codex/shared-handoff-audit-20261109]
    paths: [.github/workflows/refresh-doc-cleanup.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/shared-handoff-audit-20261109
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python3 tools/build_static.py
      - run: npm run build:study
      - run: npm test
      - run: git diff --check
      - name: Commit refreshed output and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-doc-cleanup.yml
          git add -A
          git commit -m 'Regenerate static output and remove one-time cleanup workflow'
          git push origin HEAD:codex/shared-handoff-audit-20261109
