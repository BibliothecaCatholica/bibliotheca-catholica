name: Generate reader update pages
on:
  push:
    branches: [reader-passage-design-20261109]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          python - <<'PYTHON'
          import sys
          sys.path.insert(0, 'tools')
          import hubio
          hub = hubio.load()
          for row in [{'section': 'references', 'category': 'Specialist libraries', 'name': 'Historical Evidence of Jesus Christ', 'url': 'https://noxidsoft.github.io/all-historical-evidence-of-jesus-christ/', 'desc': 'Independent chronological research dossier with a citation register and links to ancient sources. Distinguishes collections of Scripture, early Christian writings, external witnesses, and archaeology.', 'tags': ['historical Jesus', 'primary sources']}, {'section': 'references', 'category': 'Specialist libraries', 'name': 'Morals of the Church', 'url': 'https://moralsofthechurch.com/', 'desc': 'Independent library of classic moral theology manuals in English. Browse by topic, virtue, or vice, or search the manuals for a phrase.', 'tags': ['moral theology', 'manuals']}]:
              if not any(r['url']==row['url'] for r in hub['resources']):
                  hub['resources'].append(row)
          hubio.save(hub)
          PYTHON
          sed -i 's/reader.css?v=20261025-v12/reader.css?v=20261109-passages/;s/library.js?v=20261109-reader2/library.js?v=20261109-passages/' index.html
      - run: npm run build && python3 tools/build_static.py && npm test
      - run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated reader pages and catalog bundles'
          git push
