name: Validate library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- data/library.js data/guide.js data/saints.js data/saints-aliases.json data/rights.js data/rights-pages.js data/isidore-matches.js data/isidore-matches.json data/rites.js data/rites.json styles/rites.css data/reading-plans.json data/reading-plans.js data/text-pages.json data/summa.json data/text-pages.js data/print-editions.json data/print-editions.js
      - run: python3 tools/build_static.py
      - run: git diff --exit-code && test -z "$(git status --porcelain -- sitemap.xml robots.txt 404.html docs/static-pages.txt index.html data/site-copy.js build.json author work summa editions reading policy saints rites rights takedown about search disclosure)"
      - run: npm run build:study
      - run: git diff --exit-code -- assets/study assets/libraries pagefind study/passages
      - run: npm test
      - run: node --check app.js && node --check scripts/boot.js && node --check scripts/timeline.js && node --check scripts/library.js && node --check scripts/guides.js && node --check scripts/saints.js && node --check scripts/rights.js && node --check scripts/rites.js && node --check scripts/plans.js && node --check data/site-copy.js
