name: Validate library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: git diff --exit-code -- data/library.js data/guide.js
      - run: npm test
      - run: node --check app.js && node --check scripts/library.js && node --check scripts/guides.js
