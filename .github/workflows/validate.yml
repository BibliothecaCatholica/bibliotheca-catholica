name: Validate library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: git diff --exit-code -- data/library.js data/guide.js data/saints.js data/saints-aliases.json data/rights.js data/rights-pages.js data/isidore-matches.js data/isidore-matches.json data/rites.js data/rites.json styles/rites.css data/reading-plans.json data/reading-plans.js
      - run: python3 tools/build_static.py
      - run: git diff --exit-code && test -z "$(git status --porcelain -- sitemap.xml robots.txt 404.html docs/static-pages.txt index.html data/site-copy.js build.json author work editions reading policy saints rites rights takedown about search)"
      - run: npm test
      - run: node --check app.js && node --check scripts/boot.js && node --check scripts/timeline.js && node --check scripts/library.js && node --check scripts/guides.js && node --check scripts/saints.js && node --check scripts/rights.js && node --check scripts/rites.js && node --check scripts/plans.js && node --check data/site-copy.js
